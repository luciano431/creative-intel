# ---------------------------------------------------------------------------
# IMPORTANTE: fuera de la Unión Europea, la Biblioteca de Meta solo muestra los anuncios comerciales
# MIENTRAS ESTÁN ACTIVOS. Las ediciones pasadas no se pueden reconstruir desde Meta: por eso el modo
# evento se corre "en vivo" (radar evento <clave> --live) varias veces antes y durante el evento,
# y el Radar guarda su propio archivo. Al año siguiente, esa edición ya queda disponible para estudiar.
#
# Fechas comerciales para el "modo evento". Cada cliente puede sumar o pisar eventos
# en config/clients/<cliente>/events.yaml (misma forma).
#
# Por cada evento:
#   keywords   palabras con las que la competencia lo nombra (se buscan en la Biblioteca de Meta)
#   editions   ediciones pasadas a estudiar: ventana de búsqueda (from/to) y días del evento (start/end).
#              La ventana arranca antes para ver cuánto se anticipan las marcas.
#   next       próxima edición (para armar el calendario de piezas). Confirmar fechas con el organizador.
# ---------------------------------------------------------------------------
events:
  cyberlunes:
    name: CyberLunes
    countries: [UY]
    keywords: [cyberlunes, cyber lunes, ciberlunes, cyber monday]
    editions:
      - label: 2025-06
        start: 2025-06-02      # CyberLunes junio 2025: 2 al 4 de junio (CEDU)
        end: 2025-06-04
        from: 2025-05-12
        to: 2025-06-10
      - label: 2025-11
        start: 2025-11-03      # 3 al 5 de noviembre (anuncio de SKY en la Biblioteca: "Comprá del 03 al 05 de Noviembre")
        end: 2025-11-05
        from: 2025-10-15
        to: 2025-11-12
      - label: 2026-06
        start: 2026-06-01      # 1 al 3 de junio de 2026 (ciberlunes.uy / CEDU; Sodimac, Stadium y Mercado Libre lo confirman)
        end: 2026-06-03
        from: 2026-05-11
        to: 2026-06-10
    next:
      start: null              # completar cuando el organizador confirme la fecha
      end: null
  black-friday:
    name: Black Friday
    countries: [UY]
    keywords: [black friday, blackfriday, black week, viernes negro]
    editions:
      - label: 2025
        start: 2025-11-28
        end: 2025-11-28
        from: 2025-11-07
        to: 2025-12-03
    next:
      start: 2026-11-27
      end: 2026-11-27
