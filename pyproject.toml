[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-intel"
version = "0.1.0"
description = "Radar creativo de Ranker: monitoreo creativo de la competencia en Meta y Google y plan creativo mensual por cliente"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.10",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
scraping = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
creative-intel = "creative_intel.cli:app"
radar = "creative_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creative_intel = ["report/templates/*", "web_templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
